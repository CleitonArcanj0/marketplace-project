<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/checkout.css">
    <link rel="stylesheet" href="style/mediaqueries.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <title>MarketHub</title>
</head>

<body>
    <header class="navbar">

        <div class="logo">
            <i class="fa-solid fa-bars fa-2xl"></i>
            <i class="fa-solid fa-bag-shopping fa-2xl"></i>
            <h1>MarketHub</h1>
        </div>
        <div class="info-users">
        
            <div class="carrinho-compras">
                <i class="fa-solid fa-cart-shopping fa-2xl"></i>
            </div>
        </div>

        <div class="areaBusca">
            <span class="material-symbols-outlined iconePesquisa">
                search
            </span>
            <label for="pesquisar" class="sr-only">Buscar Produtos</label>
            <input type="text" placeholder="Buscar Produtos" id="pesquisar" class="pesquisarProdutos">
        </div>

    </header>


    <main class="container" id="container-main">
        <aside id="carrinho" class="sidebar-carrinho">

        </aside>
        <aside class="sidebar-categorias">
            <ul id="listaCategorias" class="categorias">

            </ul>
        </aside>

        <section id="cards" class="produtos ">

        </section>


    </main>
    <footer>
        <p>Página criada Por Cleiton Arcanjo</p>
    </footer>

    <script type="module" src="Js/api.js" defer></script>
    <script type="module" src="Js/ui/productsUI.js" defer></script>
    <script type="module" src="Js/ui/detailsUI.js" defer></script>
    <script type="module" src="Js/script.js" defer></script>
    <script type="module" src="Js/ui/checkoutUI.js" defer></script>
</body>

</html>
